name: CI

on:
  pull_request:
  push:
    branches: [main, codex/docs-v2]
  schedule:
    - cron: "0 8 * * *" # Every day at 8:00 UTC

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test documentation tooling
        run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Parse repository
        id: parse-repo
        run: |
          echo "owner=${GITHUB_REPOSITORY%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Generate read-only source token
        id: source-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.parse-repo.outputs.owner }}
          permission-contents: read
          # Keep in sync with scripts/sources.json and deploy-dist.yml.
          repositories: |
            cli-beta
            fusor-v2
            docs

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # The nightly run is what catches a source repo's main drifting away from
      # the package version installed here.
      - name: Generate docs from Vellum templates
        run: pnpm docs:generate
        env:
          DOCS_SOURCE_MODE: git
          DOCS_GH_TOKEN: ${{ steps.source-token.outputs.token }}

      - name: Typecheck documentation code blocks
        run: pnpm typecheck:docs
