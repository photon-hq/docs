name: Deploy dist

on:
  push:
    branches: [main]
  # Source repos notify us when their docs/ changes. Add one type per source in
  # scripts/sources.json; each source repo sends its own event_type.
  repository_dispatch:
    types: [photon-cli-docs]
  workflow_dispatch:

# One running build plus at most one queued collapses bursts -- watcher
# dispatches and source updates alike -- into a single trailing deploy.
concurrency:
  group: deploy-dist
  cancel-in-progress: false

# The default GITHUB_TOKEN is only ever read here; pushing to dist and cloning
# source repos use the App installation token minted below.
permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Parse repository
        id: parse-repo
        run: |
          echo "owner=${GITHUB_REPOSITORY%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.parse-repo.outputs.owner }}
          # The push to dist and the source clones need repository contents
          # only; withhold every other permission the App installation holds.
          permission-contents: write
          # Add each source repo from scripts/sources.json here so the sparse
          # clone in sync-docs can reach it.
          repositories: |
            ${{ steps.parse-repo.outputs.name }}
            cli-beta

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Generate docs from Vellum templates
        run: pnpm docs:generate
        # sync-docs pulls per-source authored docs from the configured git ref
        # while Vellum extracts types from the installed package versions.
        env:
          DOCS_SOURCE_MODE: git
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Record the OpenAPI spec version this build saw
        # The aggregator serves a strong SHA-256 ETag. openapi-watch.yml
        # compares this stamp against the live document and redeploys on drift,
        # which is what keeps the API playground fresh -- Mintlify ingests the
        # remote spec only at deployment, never per page view. An unreachable
        # aggregator leaves no stamp rather than failing the deploy; the
        # watcher skips when its own probe fails, so the two converge on the
        # next cycle in which the aggregator is up.
        run: |
          etag=$(curl -sSfI --max-time 30 https://api.staging.photon.codes/openapi.json \
            | tr -d '\r' | awk 'tolower($1)=="etag:" {print $2}') || etag=""
          if [ -n "$etag" ]; then
            printf '%s\n' "$etag" > .openapi-etag
            cat .openapi-etag
          else
            echo "::warning::no ETag from the aggregator; stamp omitted"
          fi

      - name: Push to dist branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Force-add the generated navigation (gitignored, but needed on dist)
          git add -f docs.json
          [ -f .openapi-etag ] && git add -f .openapi-etag

          # Force-add all Vellum-generated files (gitignored, but needed on dist).
          # Template list comes from the assembled tree (.vellum-src), not docs-src,
          # since sources may be pulled from other repos. May be empty while no
          # source is registered, so guard against an argument-less `git add`.
          vel_out=$(find .vellum-src -name '*.vel' | sed 's|^.vellum-src/||;s|\.vel$||')
          if [ -n "$vel_out" ]; then
            git add -f $vel_out
          fi

          # Force-add the generated problem catalogue. It is not Vellum output,
          # so the *.vel glob above does not cover it.
          git add -f problems

          # Force-add custom llms.txt generator output (also gitignored)
          git add -f llms.txt llms-full.txt llms-*.txt

          # Commit onto a detached HEAD so main is untouched
          TREE=$(git write-tree)
          PARENT=$(git rev-parse HEAD)
          COMMIT=$(git commit-tree "$TREE" -p "$PARENT" \
            -m "build: generate docs from $(git rev-parse --short HEAD)")

          git push "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git" \
            "$COMMIT":refs/heads/dist --force
