name: Deploy dist

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [spectrum-cloud-release, spectrum-ts-docs, photon-cli-docs, fusor-ws-docs]
  workflow_dispatch:

permissions:
  contents: read

# Repository dispatches run from the default branch. Delegate all publication
# to the docs-v2 source branch so main cannot overwrite dist with the old site.
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    uses: photon-hq/docs/.github/workflows/deploy-dist.yml@codex/docs-v2
    secrets: inherit
